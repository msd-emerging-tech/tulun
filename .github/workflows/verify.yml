name: Backend verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_DB: tulun_test
          POSTGRES_USER: tulun
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tulun"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install poetry==2.2.1 poetry-plugin-export==1.10.0 pip-audit==2.10.1
      - run: poetry install --only main --no-root --no-interaction
      - run: poetry run python manage.py test --settings=tulun.test_settings
      - run: poetry run python manage.py test --settings=tulun.test_settings
        env:
          TULUN_TEST_DATABASE_URL: postgresql://tulun:isolated-ci-only@127.0.0.1:5432/tulun_test
      - run: python scripts/runtime_smoke.py --docker
      - run: docker build -t tulun-verify .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.69.3
      - run: bash scripts/supply-chain.sh tulun-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supply-chain-evidence
          path: artifacts/
